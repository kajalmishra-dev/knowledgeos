name: Backend CI

on:
  push:
    paths:
      - "apps/backend/**"
      - "infrastructure/docker/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "infrastructure/docker/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knowledgeos
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledgeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledgeos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend
        working-directory: apps/backend
        run: python -m pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/backend
        run: ruff check app tests

      - name: Apply migrations
        working-directory: apps/backend
        run: alembic upgrade head

      - name: Test
        working-directory: apps/backend
        run: pytest
