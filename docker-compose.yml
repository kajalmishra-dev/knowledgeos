name: knowledgeos

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowledgeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgeos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-knowledgeos}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - knowledgeos

  redis:
    image: redis:8-alpine
    container_name: knowledgeos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - knowledgeos

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: knowledgeos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - knowledgeos

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: knowledgeos-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-knowledgeos}
    volumes:
      - ./infrastructure/minio/init/create-bucket.sh:/init/create-bucket.sh:ro
    entrypoint: ["/bin/sh", "/init/create-bucket.sh"]
    networks:
      - knowledgeos

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    container_name: knowledgeos-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: &backend-env
      APP_NAME: ${APP_NAME:-KnowledgeOS API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-knowledgeos}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-knowledgeos}
      MINIO_SECURE: "false"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      INGESTION_QUEUE: ${INGESTION_QUEUE:-arq}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10000000}
      INGESTION_CHUNK_SIZE: ${INGESTION_CHUNK_SIZE:-800}
      INGESTION_CHUNK_OVERLAP: ${INGESTION_CHUNK_OVERLAP:-150}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-extractive}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.18}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
      ]
    volumes:
      - ./apps/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/ready"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 40s
    networks:
      - knowledgeos

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    container_name: knowledgeos-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      SKIP_MIGRATIONS: "true"
    command: ["arq", "app.workers.ingestion.WorkerSettings"]
    volumes:
      - ./apps/backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - knowledgeos

networks:
  knowledgeos:
    name: knowledgeos-network
    driver: bridge

volumes:
  postgres_data:
    name: knowledgeos-postgres-data
  redis_data:
    name: knowledgeos-redis-data
  minio_data:
    name: knowledgeos-minio-data
